name: "\U0001F4DD 更新软件包信息"
description: 更新已有软件包的描述、安装命令或其他信息
title: "[更新] <软件包名称>"
labels: ["update"]
assignees: []

body:

  - type: markdown
    attributes:
      value: |
        感谢您更新软件包信息！

  - type: input
    id: package-name
    attributes:
      label: 软件包名称
      placeholder: "例如: jq, fzf, delta"
    validations:
      required: true

  - type: textarea
    id: update-info
    attributes:
      label: 更新内容
      description: 请说明需要更新什么，以及更新后的内容
      placeholder: |
        例如：
        安装命令需要从 brew install jq 更新为 brew install jq-devel
        原因：官方已启用新命名
    validations:
      required: true
