name: "\U0001F4DD 更新软件包信息"
description: 更新已有软件包的描述、安装命令或其他信息
title: "[更新] <软件包名称>"
labels: ["update"]
assignees: []

body:

  - type: markdown
    attributes:
      value: |
        感谢您更新软件包信息！

        ---
        **提示**：提交前请查阅 [YML 字段说明](../docs/YML_SCHEMA.md)。

  - type: input
    id: package-name
    attributes:
      label: 软件包名称
      description: 需要更新的软件包名称
      placeholder: "例如: jq, fzf, delta"
    validations:
      required: true

  - type: textarea
    id: current-info
    attributes:
      label: 当前信息
      description: 需要更新的字段当前内容
      placeholder: "例如：当前安装命令是 brew install jq"
    validations:
      required: true

  - type: textarea
    id: updated-info
    attributes:
      label: 更新后的信息
      description: 更新后的内容
      placeholder: "例如：更新为 brew install jq-git"
    validations:
      required: true

  - type: textarea
    id: update-reason
    attributes:
      label: 更新原因
      description: 简述更新原因
      placeholder: "例如：官方已发布新版本"
