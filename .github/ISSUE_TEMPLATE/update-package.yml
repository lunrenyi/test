name: "\U0001F4DD 更新软件包信息"
description: 更新已有软件包的描述、安装命令或其他信息
title: "[更新] <软件包名称>"
labels: ["update"]
assignees: []

body:

  - type: markdown
    attributes:
      value: |
        感谢您更新软件包信息！请填写以下内容。

        ---
        提交前请查阅 [YML 字段说明](../docs/YML_SCHEMA.md)。

  - type: input
    id: package-name
    attributes:
      label: 软件包名称
      description: 需要更新的软件包名称
      placeholder: "例如: jq, fzf, delta"
    validations:
      required: true

  - type: input
    id: category
    attributes:
      label: 分类目录
      description: 该 yml 文件所在的目录
      placeholder: "例如: network, data-json-yml"
    validations:
      required: true

  - type: textarea
    id: current-info
    attributes:
      label: 当前信息
      description: 需要更新的字段当前内容
      placeholder: |
        例如：
        当前 desc.cn：jq 是一个命令行 JSON 处理器
        当前 rule.darwin/brew/cmd：brew install jq
    validations:
      required: true

  - type: textarea
    id: updated-info
    attributes:
      label: 更新后的信息
      description: 更新后的内容
      placeholder: |
        例如：
        更新后 desc.cn：jq 是一个轻量级且灵活的命令行 JSON 处理器
        更新后 rule.darwin/brew/cmd：brew install jq-git
    validations:
      required: true

  - type: textarea
    id: update-reason
    attributes:
      label: 更新原因
      description: 简述更新原因
      placeholder: "例如：官方安装命令已更新，新增 Homebrew 安装方式"
