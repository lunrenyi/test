name: "\U0001F41E 报告问题"
description: 报告软件包安装问题或其他问题
title: "[问题] <软件包名称>"
labels: ["bug"]
assignees: []

body:

  - type: markdown
    attributes:
      value: |
        感谢您报告问题！请填写以下信息。

  - type: input
    id: package-name
    attributes:
      label: 软件包名称
      placeholder: "例如: jq, fzf, delta"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      description: "例如：macOS (Homebrew), Ubuntu (apt), Arch Linux (pacman)"
      placeholder: "例如: macOS, Ubuntu, Arch"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 请描述您遇到的问题
      placeholder: |
        请描述：
        1. 您想做什么？
        2. 遇到了什么错误？
        3. 错误信息是什么？
    validations:
      required: true

  - type: input
    id: install-command
    attributes:
      label: 执行的安装命令
      placeholder: "例如: brew install jq"
    validations:
      required: true
