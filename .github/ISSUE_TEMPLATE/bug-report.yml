name: "\U0001F41E 报告问题"
description: 报告软件包安装问题或其他问题
title: "[问题] <软件包名称>"
labels: ["bug"]
assignees: []

body:

  - type: markdown
    attributes:
      value: |
        感谢您报告问题！请填写以下信息。

  - type: input
    id: package-name
    attributes:
      label: 软件包名称
      placeholder: "例如: jq, fzf, delta"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 请描述您遇到的问题、执行的安装命令、错误信息
      placeholder: |
        例如：
        在 macOS 上执行 brew install jq 失败，报错：Formula not found
    validations:
      required: true
