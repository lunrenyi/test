name: "\U0001F381 提交新软件包"
description: 提交一个新的软件包到 x-cmd install 元数据仓库
title: "[新增] <软件包名称>"
labels: ["new-package"]
assignees: []

body:

  - type: markdown
    attributes:
      value: |
        感谢您提交新软件包！

        请提供以下基本信息，其他内容（分类、中英文描述、安装命令规范化）由 AI 在生成 PR 时完成。

  - type: input
    id: package-name
    attributes:
      label: 软件包名称
      description: 软件包的英文名称
      placeholder: "例如: jq, fzf, delta"
    validations:
      required: true

  - type: input
    id: homepage
    attributes:
      label: 官方主页或仓库 URL
      description: 项目的 GitHub 仓库或官方主页
      placeholder: "https://github.com/username/repo"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 软件描述
      description: 一句话描述这个软件是做什么的
      placeholder: "例如: 一个轻量级且灵活的命令行 JSON 处理器"
    validations:
      required: true

  - type: textarea
    id: install-rules
    attributes:
      label: 安装信息
      description: |
        请提供该软件的安装命令、适配环境、来源参考。
        AI 会帮您规范化格式。
      placeholder: |
        示例：
        macOS 上用 Homebrew 安装：brew install jq
        Ubuntu 上用 apt 安装：sudo apt-get install jq
        官方文档：https://github.com/jqlang/jq#installation
    validations:
      required: true
