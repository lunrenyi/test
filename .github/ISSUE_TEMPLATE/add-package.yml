name: "\U0001F381 提交新软件包"
description: 提交一个新的软件包到 x-cmd install 元数据仓库
title: "[新增] <软件包名称>"
labels: ["new-package"]
assignees: []

body:

  - type: markdown
    attributes:
      value: |
        感谢您提交新软件包！请填写以下信息。

        ---
        **提示**：必填项为软件包名称、主页 URL、描述（中英文）、安装命令。
        提交前请查阅 [YML 字段说明](../docs/YML_SCHEMA.md)。

  - type: input
    id: package-name
    attributes:
      label: 软件包名称
      description: 软件包的英文名称（将作为 yml 文件名）
      placeholder: "例如: jq, fzf, delta"
    validations:
      required: true

  - type: input
    id: homepage
    attributes:
      label: 主页/仓库 URL
      description: 项目的 GitHub 仓库或官方主页 URL
      placeholder: "https://github.com/username/repo"
    validations:
      required: true

  - type: input
    id: category
    attributes:
      label: 分类目录
      description: "将 yml 文件放在 src/ 下的哪个目录？例如：network, osman, terminal"
      placeholder: "例如: network, reader, misc"
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: 编程语言
      placeholder: "例如: Go, Rust, Python, C"
    validations:
      required: true

  - type: textarea
    id: desc-cn
    attributes:
      label: 描述（中文）
      description: 一句话描述软件包的用途
      placeholder: "例如: jq 是一个轻量级且灵活的命令行 JSON 处理器"
    validations:
      required: true

  - type: textarea
    id: desc-en
    attributes:
      label: 描述（英文）
      description: One sentence describing the package
      placeholder: "Example: jq is a lightweight and flexible command-line JSON processor"
    validations:
      required: true

  - type: textarea
    id: install-rules
    attributes:
      label: 安装命令
      description: |
        请提供该软件在不同系统下的安装命令。
        格式：
        <os>/<tool>:
          cmd: <安装命令>
          reference: <命令来源URL>
          dsnap: <包名>  # 可选
    validations:
      required: true
      placeholder: |
        示例：
        darwin/brew:
          cmd: brew install jq
          reference: https://command-not-found.com/jq

        debian/apt:
          cmd: sudo apt-get install jq
          reference: https://command-not-found.com/jq
          dsnap: jq

        arch/pacman:
          cmd: sudo pacman -S jq
          reference: https://command-not-found.com/jq
